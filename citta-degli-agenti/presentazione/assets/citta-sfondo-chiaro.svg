.croce { animation: pulsa 6s ease-in-out infinite; } .c2 { animation-delay: -2s; } .c3 { animation-delay: -4s; }
@keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
</style>
