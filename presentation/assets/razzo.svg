<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
<title>Il razzo di MdExplorer</title>
<style>
.fiamma { transform-box: fill-box; transform-origin: 50% 0%; animation: fiamma .28s ease-in-out infinite alternate; }
@keyframes fiamma { from { transform: scaleY(.78) scaleX(.94); } to { transform: scaleY(1.12) scaleX(1.04); } }

#razzo { animation: dondola 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes dondola { 0%,100% { transform: translate(0,0); } 50% { transform: translate(5px,-5px); } }
.scia { stroke: #0b5c84; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 18 26; animation: scia 0.9s linear infinite; }
@keyframes scia { to { stroke-dashoffset: -44; } }
</style>
<g opacity=".8">
  <path class="scia" d="M150,62 L96,116" transform="translate(-58 -22)"/>
  <path class="scia" d="M150,62 L84,128" transform="translate(64 96)" style="animation-delay:-.4s"/>
  <path class="scia" d="M150,62 L106,106" transform="translate(-92 86)" style="animation-delay:-.2s"/>
</g>
<g id="razzo"><g transform="translate(128 112) rotate(45) scale(1.02)">
  <g class="fiamma">
    <path d="M-13,55 Q0,104 13,55 Z" fill="#f29900" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-6,57 Q0,84 6,57 Z" fill="#ffe08a"/>
  </g>
  <path d="M-22,12 L-48,40 L-48,62 L-22,46 Z" fill="#d3efff" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
  <path d="M22,12 L48,40 L48,62 L22,46 Z" fill="#d3efff" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-12,40 L-17,56 L17,56 L12,40 Z" fill="#4fc3f7" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-22,42 L-22,-22 C-22,-62 -9,-84 0,-94 C9,-84 22,-62 22,-22 L22,42 Z" fill="#4fc3f7" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-20.5,-40 C-17,-64 -8,-82 0,-91 C8,-82 17,-64 20.5,-40 Z" fill="#d3efff"/>
  <path d="M-21,-40 L21,-40" stroke="#0b5c84" stroke-width="5" stroke-linecap="round"/>
  <rect x="-25" y="28" width="50" height="12" rx="3" fill="#d3efff" stroke="#0b5c84" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="0" cy="-8" r="12" fill="#fff" stroke="#0b5c84" stroke-width="5"/>
  <path d="M-6,-12 A8,8 0 0 1 2,-15" fill="none" stroke="#d3efff" stroke-width="3" stroke-linecap="round"/></g></g>
</svg>
