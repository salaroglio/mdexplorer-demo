    <rect x="-116" y="19.720000000000002" width="232" height="15.08" fill="#dfe9f7"/>
  </g></g>
  <circle r="58" fill="none" stroke="#c5d5ec" stroke-width="3"/>
  <g clip-path="url(#sat-davanti)">
    <ellipse rx="107.30000000000001" ry="29.0" fill="none" stroke="#c5d5ec" stroke-width="15"/>
    <ellipse rx="107.30000000000001" ry="29.0" fill="none" stroke="#eef3fb" stroke-width="9"/>
  </g>
</g></g>
<g transform="translate(60 64)"><g class="ast a4"><g transform="rotate(20) scale(0.46)">
