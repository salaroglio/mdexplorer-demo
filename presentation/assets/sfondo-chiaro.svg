<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice">
<title>Sfondo chiaro: Saturno, asteroidi e suolo lunare appena accennati</title>
<style>
.ast { transform-box: fill-box; transform-origin: center; }
.a1 { animation: deriva1 26s ease-in-out infinite alternate; }
.a2 { animation: deriva2 34s ease-in-out infinite alternate; }
.a3 { animation: deriva3 22s ease-in-out infinite alternate; }
@keyframes deriva1 { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(34px,-22px) rotate(70deg); } }
@keyframes deriva2 { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(-40px,26px) rotate(-90deg); } }
@keyframes deriva3 { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(22px,30px) rotate(120deg); } }
.a4 { animation: deriva4 24s ease-in-out infinite alternate; }
@keyframes deriva4 { from { transform: translate(0,0) rotate(0deg); } to { transform: translate(10px,-6px) rotate(80deg); } }

.fiamma { transform-box: fill-box; transform-origin: 50% 0%; animation: fiamma .28s ease-in-out infinite alternate; }
@keyframes fiamma { from { transform: scaleY(.78) scaleX(.94); } to { transform: scaleY(1.12) scaleX(1.04); } }

.razzo-vola { animation: sorvola 40s linear infinite; }
@keyframes sorvola { 0% { transform: translate(-60px, 58px); } 30% { transform: translate(1360px, -30px); } 100% { transform: translate(1360px, -30px); } }

.fasce { animation: fasce 18s ease-in-out infinite alternate; }
@keyframes fasce { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
.croce { animation: pulsa 6s ease-in-out infinite; } .c2 { animation-delay: -2s; } .c3 { animation-delay: -4s; }
@keyframes pulsa { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.fiamma path:first-child { fill: #f6e3c0; } .fiamma path:last-child { fill: #fbf2df; }
</style>
<defs>
  <linearGradient id="carta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f6fc"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#carta)"/>
