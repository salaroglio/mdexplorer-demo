  <ellipse cx="4" cy="-28" rx="4" ry="3" fill="#d9e5f5"/>
</g></g></g>
<g stroke="#c5d5ec" stroke-width="3" stroke-linecap="round">
  <path class="croce" d="M170,30 h14 M177,23 v14"/><path class="croce c2" d="M1030,70 h12 M1036,64 v12"/>
  <path class="croce c3" d="M540,22 h10 M545,17 v10"/><path class="croce c2" d="M760,40 h12 M766,34 v12"/>
