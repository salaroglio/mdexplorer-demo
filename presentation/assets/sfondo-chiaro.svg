<path d="M0,690 C170,664 330,676 470,692 C620,708 760,672 920,678 C1060,684 1170,668 1280,684 L1280,720 L0,720 Z" fill="#e6eef9" stroke="#c5d5ec" stroke-width="3" stroke-linejoin="round"/>
<g fill="#d9e5f5" stroke="#c5d5ec" stroke-width="2.5">
