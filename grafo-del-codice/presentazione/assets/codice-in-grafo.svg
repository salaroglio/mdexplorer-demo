<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" width="660" height="290">
<title>Un file sorgente, riga per riga, diventa un grafo di simboli e relazioni</title>
<style>
.riga, .freccia, .nodo, .arco { opacity: 0; animation: 8s ease-out infinite both; }
.riga { animation-name: riga; } .freccia { animation-name: riga; animation-delay: 1.9s; }
@keyframes riga { 0% { opacity: 0; transform: translateX(-8px); } 4%,72% { opacity: 1; transform: none; } 80%,100% { opacity: 0; } }
.lettore { animation: legge 8s ease-in-out infinite; }
@keyframes legge { 0%,4% { transform: translateY(0); opacity: 0; } 8% { opacity: .9; } 24% { transform: translateY(180px); opacity: .9; } 28%,100% { transform: translateY(180px); opacity: 0; } }
.nodo { animation-name: nodo; transform-box: fill-box; transform-origin: center; }
@keyframes nodo { 0% { opacity: 0; transform: scale(.4); } 5%,66% { opacity: 1; transform: none; } 74%,100% { opacity: 0; } }
.arco { animation-name: arco; }
@keyframes arco { 0% { opacity: 0; } 6%,60% { opacity: .95; } 68%,100% { opacity: 0; } }
</style>
